version: '3.8'

services:
  postgres:
    image: postgres:16.8
    container_name: myproject_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: myproject_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: antoni0paper0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myproject_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: myproject_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myproject_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: antoni0paper0
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_LIQUIBASE_ENABLED: "true"
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local