version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: english_platform_db
    environment:
      POSTGRES_DB: english_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    networks:
      - english-platform-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  java-app:
    build: .
    container_name: english_platform_app
    ports:
      - "8080:8081"                 # хост:контейнер -> теперь работает
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/english_platform
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
      - JWT_SECRET=mySuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLongAndSecure
      # SERVER_PORT не нужен, берётся из application-docker.yml
    networks:
      - english-platform-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: english_platform_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - english-platform-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: english_platform_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - english-platform-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: english_platform_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - english-platform-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: english_platform_alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config.alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - english-platform-network
    depends_on:
      - loki
    restart: unless-stopped

networks:
  english-platform-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus-data:
  grafana-storage:
  loki-data: