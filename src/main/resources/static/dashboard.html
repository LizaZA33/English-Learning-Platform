<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - English Learning Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <h1 class="nav-logo">English Learning Platform</h1>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="#" class="active">Dashboard</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="dashboard-header">
        <h1>Welcome, <span id="userName"></span>!</h1>
        <p>Role: <span id="userRole"></span></p>
    </div>

    <div class="dashboard-tabs">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="groups">My Groups</button>
        <button class="tab-btn" data-tab="progress">Progress</button>
    </div>

    <div id="overviewTab" class="tab-content active">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Lectures</h3>
                <p id="totalLectures">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed Lectures</h3>
                <p id="completedLectures">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Lessons</h3>
                <p id="totalLessons">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed Lessons</h3>
                <p id="completedLessons">0</p>
            </div>
        </div>
    </div>

    <div id="groupsTab" class="tab-content">
        <div class="groups-header">
            <h2>My Groups</h2>
            <button class="btn btn-primary" id="joinGroupBtn">Join Group</button>
        </div>
        <div id="groupsList" class="groups-list">
            <!-- Groups will be loaded here -->
        </div>
    </div>

    <div id="progressTab" class="tab-content">
        <h2>Learning Progress</h2>
        <div id="progressList" class="progress-list">
            <!-- Progress will be loaded here -->
        </div>
    </div>
</main>

<!-- Join Group Modal -->
<div id="joinGroupModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Join Group</h3>
        <form id="joinGroupForm">
            <div class="form-group">
                <label for="inviteCode">Invite Code</label>
                <input type="text" id="inviteCode" name="inviteCode" required>
            </div>
            <button type="submit" class="btn btn-primary">Join</button>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
